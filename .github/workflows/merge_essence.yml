name: Auto Merge Essence Patches
on:
  push:
    paths:
      - 'essence/updates/**'
  workflow_dispatch:

jobs:
  merge-logic:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Logic Merge
        run: |
          python << 'PYEOF'
          import os
          base_p = 'essence/00_base.md'
          up_d = 'essence/updates'
          if not os.path.exists(up_d) or not os.listdir(up_d):
              exit(0)
          with open(base_p, 'r', encoding='utf-8') as f: 
              base = f.read()
          patches = []
          for fn in sorted(os.listdir(up_d)):
              if fn.endswith('.md'):
                  p_path = os.path.join(up_d, fn)
                  with open(p_path, 'r', encoding='utf-8') as p:
                      patches.append(p.read())
                  os.remove(p_path)
          new_c = base + "\n\n--- # Patch Merged ---\n\n" + "\n\n".join(patches)
          with open(base_p, 'w', encoding='utf-8') as f: 
              f.write(new_c)
          PYEOF

      - name: Commit and Push
        run: |
          git config --global user.name "Essence Bot"
          git config --global user.email "bot@github.com"
          git add .
          git commit -m "🤖 執行自動邏輯重構 [skip ci]" || exit 0
          git push
