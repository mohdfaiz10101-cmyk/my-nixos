# /mnt/ai/ai-cluster/litellm/config.yaml
# 三層算力架構：本地優先 + 雲端 fallback
# 已啟用 Redis 緩存降低 Token 消耗

model_list:

  # ── auto = 本地 Qwen3 優先（自動 fallback）──
  - model_name: auto
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://host.docker.internal:11434
      timeout: 120
      extra_body:
        think: false

  # ── 本地模型（手動選擇用）──
  - model_name: local/qwen3-8b
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://host.docker.internal:11434
      timeout: 120
      extra_body:
        think: false

  - model_name: local/deepseek-r1-14b
    litellm_params:
      model: ollama/deepseek-r1:14b
      api_base: http://host.docker.internal:11434
      timeout: 120
      extra_body:
        think: false

  # ── 雲端專家 ──
  - model_name: cloud/claude-opus
    litellm_params:
      model: openai/claude-sonnet-4-20250514
      api_base: https://hone.vvvv.ee
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: cloud/gemini-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GOOGLE_API_KEY

  - model_name: cloud/gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro-preview-06-05
      api_key: os.environ/GOOGLE_API_KEY

  # ── 智譜 GLM（支持 Prompt 緩存）──
  - model_name: cloud/glm-4
    litellm_params:
      model: zhipu/glm-4
      api_key: os.environ/ZHIPU_API_KEY
      timeout: 120

  - model_name: cloud/glm-4-flash
    litellm_params:
      model: zhipu/glm-4-flash
      api_key: os.environ/ZHIPU_API_KEY
      timeout: 60

  - model_name: cloud/glm-4-plus
    litellm_params:
      model: zhipu/glm-4-plus
      api_key: os.environ/ZHIPU_API_KEY
      timeout: 120

litellm_settings:
  drop_params: true
  # 啟用緩存配置
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    ttl: 3600
    supported_call_types:
      - completion
      - acompletion
    default_in_memory_ttl: 3600

router_settings:
  num_retries: 2
  timeout: 120
  routing_strategy: simple-shuffle
  fallbacks:
    - auto: [local/deepseek-r1-14b, cloud/glm-4-flash, cloud/claude-opus]
    - local/qwen3-8b: [local/deepseek-r1-14b, cloud/glm-4-flash]
    - cloud/claude-opus: [cloud/gemini-pro, cloud/glm-4-plus]
    - cloud/glm-4: [cloud/glm-4-flash, cloud/gemini-flash]
    - cloud/glm-4-flash: [local/qwen3-8b, cloud/gemini-flash]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY